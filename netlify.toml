[build]
  command = "npm run build"
  publish = "dist"

# Redirect the old/default Netlify URL to the new APEX Store domain
[[redirects]]
  from = "https://apexstoress.netlify.app/*"
  to = "https://apexstorepk.shop/:splat"
  status = 301
  force = true

# React SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200